[project]
name = "agentos"
version = "0.1.0"
description = "Agent OS V1 control-plane utilities (config, routing, task state, telemetry, knowledge gate)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agentos = "agentos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.pytest.ini_options]
testpaths = ["evals"]
markers = ["live: touches real local CLIs/subscriptions (opt-in via AGENTOS_LIVE=1)"]
