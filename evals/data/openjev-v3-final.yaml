- Synthetic config-derived scenarios; model-assisted authoring, NOT human review.
  Author had seen v2 results and categories, no v3 output.
- 107 scenario families x EN/TR x real/misleading labels; observations within a family
  are related, not independent.
- 'Partitions: cal (fit calibration/thresholds), opt (choose policy), final (frozen,
  never tuned on).'
