version: 1
dataset: openjev-v3-cal
authored: '2026-10-18'
facts:
  roles:
    source: config/workers.yaml
    rule: Configured roles determine intent preferences; they are not measured model
      ability.
  capabilities:
    source: config/capability_registry.yaml
    rule: Required capabilities must be available via declared supported integrations;
      explicit scenario missing facts override static availability.
  review:
    source: config/routing.yaml roles.reviewer
    rule: Reviewer differs from primary worker.
  fallback:
    source: config/routing.yaml cloud chains; agentos/router.py
    rule: Use the other available worker on recorded failure/unavailability.
  risk:
    source: config/routing.yaml risk
    rule: High risk without human approval blocks before inference; with recorded
      approval the role decides.
  background:
    source: config/workers.yaml; config/routing.yaml
    rule: deepseek_harness is background escalation only (interactive false).
  cost:
    source: config/providers.yaml
    rule: Prefer existing subscription access when requested; deepseek uses API access.
  contract:
    source: agentos/systemone.py
    rule: Only eligible options may be selected. No options escalates. Ambiguous answerable
      cases accept either option.
