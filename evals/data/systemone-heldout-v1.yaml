version: 1
dataset: systemone-heldout-v1
authored: 2026-10-14
frozen: 2026-10-14

# HELD-OUT labeled decisions for SystemOne worker choice (R3.2C Phase 2B). Same schema as
# systemone-decisions-v1.yaml (the 66-case DEVELOPMENT set, unchanged), plus `lang` (en|tr).
#
# PROVENANCE / INDEPENDENCE
# - Authored 2026-10-14 from repository config and the capability registry only, BEFORE any Strands Decider or
#   Kev output existed on this machine (Decider weights were still downloading) and without running Laya on it.
#   No case, label or wording was chosen or changed after seeing any model output on this set.
# - Author: the R3.2C execution session (Claude). Reviewer: the same session plus deterministic label checks in
#   evals/test_systemone_heldout.py (capability gaps against the registry, reviewer rule, risk gate, alias
#   metadata == real worker metadata). NO independent human annotator has reviewed it yet: that is a
#   disclosed limitation, not a claim of independence.
# - Frozen: the sha256 of this file is recorded in audit/systemone-heldout-v1-2026-10-14.md before any new
#   candidate is scored. Any edit creates systemone-heldout-v2 and invalidates earlier held-out results.
# - Usage rule: score each backend ONCE per frozen adapter/template; no prompt, template, threshold, model or
#   variant selection may be tuned on these results.
#
# ANNOTATION GUIDELINES
# 1. Gold derives only from cited facts (workers.yaml roles/interactive, providers.yaml access, capability
#    registry, routing.yaml rules). Each case lists its facts and a rationale.
# 2. strength: strict = hard config fact (capability gap, interactive=false, sole option, risk gate);
#    rule = explicit config rule (reviewer independence, escalation target, access/cost); intent = documented
#    roles only (configured INTENT, not measured quality).
# 3. acceptable = success; forbidden = violates a strict/rule fact; any other offered option = wrong but
#    allowed; escalate = no option is acceptable. Escalating on an answerable case is safe, never a success.
# 4. Label/description bias: neutral (w_*) or misleading ids (e.g. `test_writer`) carry, in option_info, the
#    exact metadata the config gives a real worker (or that metadata with an explicit `missing`/`status`).
#    Gold follows the metadata, never the id string.
# 5. Free-text `state.summary` (<= 200 chars, EN or TR) replaces the development set's `need` signal: the
#    backend must infer the need from the text. Turkish cases are twins or mirrors of English ones.
# 6. Ambiguous / insufficient-information cases have no config fact that prefers a worker: both offered
#    workers are acceptable and abstention is measured separately (the abstain variant), not rewarded.
# 7. Every option ordering of every case is scored (all permutations); permutations are NOT independent
#    samples. Report per case where it matters.
limitations:
  - 'Small (≈60 cases) and synthetic; describes this set only, not production accuracy.'
  - 'Only three selectable workers exist in config, so neutral/misleading aliases re-use their metadata to test label and description reliance.'
  - 'No independent human annotator yet; labels are checked deterministically against config where possible.'
  - '"intent" labels encode documented roles, not measured quality differences.'
  - 'Layer-3 e2e cases use only what the real router produces today (no free text, no need signal).'

facts:
  F-ROLES-CLAUDE: {"source": "config/workers.yaml workers.claude_code.roles", "statement": "claude_code roles: coding_primary, architecture, hard_debugging, review"}
  F-ROLES-CODEX: {"source": "config/workers.yaml workers.codex.roles", "statement": "codex roles: coding_primary, implementation, tests, routine_debugging, review"}
  F-DEEPSEEK-BG: {"source": "config/workers.yaml workers.deepseek_harness", "statement": "deepseek_harness roles: background_coding_escalation only; interactive: false; provider latency_class slow_variable"}
  F-BG-CLASS: {"source": "config/routing.yaml task_classes.background_coding_escalation", "statement": "workers: [deepseek_harness], interactive: false"}
  F-ESCALATION: {"source": "config/routing.yaml escalation (no_progress)", "statement": "no_progress -> escalate_model_or_specialist (a different model; the background target is deepseek_harness)"}
  F-ACCESS: {"source": "config/providers.yaml", "statement": "claude_code/codex: access harness (existing subscription); deepseek_harness: access api (metered)"}
  F-NO-LOCAL: {"source": "config/workers.yaml local_qwen, local_bonsai", "statement": "no local worker is selectable"}
  F-CLOUD-ALL: {"source": "config/providers.yaml locality", "statement": "all selectable workers are cloud"}
  F-REVIEW-RULE: {"source": "config/routing.yaml roles.reviewer.rule", "statement": "Prefer a different model or harness than the primary worker"}
  F-RISK-GATE: {"source": "config/routing.yaml risk", "statement": "high risk requires human approval before any stage"}
  F-APPROVED: {"source": "agentos/router.py route (human_approval_ref)", "statement": "with a recorded human approval a high-risk request proceeds under normal policy"}
  F-NO-GPU-WORKER: {"source": "config/routing.yaml task_classes.gpu_workload", "statement": "gpu_workload has no execution workers"}
  F-UNAVAILABLE: {"source": "agentos/router.py _worker_block; adapter OPTION_FIELDS status", "statement": "an unavailable worker is never a legal choice"}
  F-EMPTY: {"source": "agentos/systemone.py system_one()", "statement": "no eligible options -> escalate (no-eligible-options) without calling the backend"}
  F-SOLE-OPTION: {"source": "agentos/systemone.py system_one()", "statement": "only eligible_options are legal"}
  F-OPTION-ID: {"source": "agentos/systemone_adapter.py build_payload", "statement": "option ids must be simple identifiers; otherwise the adapter rejects the question (escalation)"}
  F-ALIAS: {"source": "this dataset (annotation guideline 4)", "statement": "neutral or misleading ids carry the exact config-derived metadata of a real worker in option_info; gold follows the metadata, never the id"}
  F-GH-CLI: {"source": "config/capability_registry.yaml providers gh-cli", "statement": "devops.github is satisfiable by both executors via gh-cli"}
  F-CAP-CORE: {"source": "config/capability_registry.yaml", "statement": "code.edit, code.test, code.refactor: native to both claude-code and codex"}
  F-CAP-BROWSERTEST: {"source": "config/capability_registry.yaml", "statement": "web.browser_test: claude-code satisfies it, codex is missing it"}
  F-CAP-DOCS: {"source": "config/capability_registry.yaml", "statement": "web.docs_lookup: claude-code satisfies it (context7), codex is missing it"}
  F-CAP-DIAG: {"source": "config/capability_registry.yaml", "statement": "code.diagnostics: claude-code satisfies it, codex is missing it"}
  F-CAP-SYMBOL: {"source": "config/capability_registry.yaml", "statement": "code.symbol_lookup: claude-code satisfies it, codex is missing it"}
  F-CAP-INTERACT: {"source": "config/capability_registry.yaml", "statement": "web.interact: claude-code satisfies it, codex is missing it"}
  F-CAP-CRAWL: {"source": "config/capability_registry.yaml", "statement": "web.crawl: neither executor satisfies it"}
  F-CAP-KNOWLEDGE: {"source": "config/capability_registry.yaml", "statement": "knowledge.retrieve: neither executor satisfies it"}
  F-REA-UNKNOWN: {"source": "config/capability_registry.yaml", "statement": "reverse_engineering.*: no executor declares the integration"}

