version: 2

# Deterministic routing policy, executed by agentos/router.py.
#
#   EVENT -> C0 deterministic rules -> C1 fastgate -> C2/C3 local -> C4 cloud
#
# Each stage is skipped (with a recorded reason) when nothing in it is usable:
# a stage whose model is a `candidate` or whose host is unreachable is never
# silently "assumed". Every decision returns a trace that goes to telemetry.

principles:
  - "Use the cheapest capable worker."
  - "Route by task role, not only task difficulty."
  - "Prefer one worker by default."
  - "Add reviewers only when they provide independent value."
  - "Use deterministic checks whenever possible."
  - "Do not invoke overlapping planning frameworks for the same task."
  - "High risk requires human approval regardless of classifier confidence."
  - "The MSI is never a boot or routing dependency of the Mac control plane."

# ---------------------------------------------------------------- C0 rules
# Task types fully handled by deterministic code — no model is invoked.
deterministic_rules:
  exit_code_check:     {handler: deterministic}
  test_result:         {handler: deterministic}
  resource_check:      {handler: deterministic}
  cron_event:          {handler: deterministic}
  permission_check:    {handler: deterministic}
  health_check:        {handler: deterministic}
  file_rename:         {handler: deterministic}

# ----------------------------------------------------------- task classes
# For each class: which cognition stages may serve it, the cloud provider
# chain (ordered, first healthy+enabled wins), and the execution worker chain.
task_classes:

  classification:
    stages: [fastgate, local_primary, local_fallback, cloud]
    cloud_chain: [claude_subscription, codex_subscription]
    workers: [claude_code, codex]

  summarization:
    stages: [local_primary, local_fallback, cloud]
    cloud_chain: [claude_subscription, codex_subscription]
    workers: [claude_code, codex]

  coding:
    stages: [cloud]
    cloud_chain: [claude_subscription, codex_subscription]
    workers: [claude_code, codex, opencode]
    reviewer_rule: "Reviewer must differ from primary worker (see roles.reviewer)."

  ui_design:
    stages: [cloud]
    cloud_chain: [claude_subscription]
    workers: [claude_code]
    reviewer_rule: "Reviewer must differ from primary worker (see roles.reviewer)."
    note: "Frontend design + implementation. The art-direction skill is chosen by the capability plan (task type -> ui.art_direction), never by description matching. Codex excluded until skill delivery is verified for it."

  background_coding_escalation:
    stages: [cloud]
    cloud_chain: [nvidia_nim]
    workers: [deepseek_harness]
    interactive: false

  review:
    stages: [cloud]
    cloud_chain: [claude_subscription, codex_subscription]
    workers: [claude_code, codex]

  research:
    stages: [local_primary, cloud]
    cloud_chain: [claude_subscription, codex_subscription]
    workers: [claude_code, codex]
    note: "Research plane is post-V1; this only routes bounded research questions."

  knowledge_ingest:
    stages: [cloud]
    cloud_chain: [claude_subscription]
    workers: [claude_code]
    write_path: secondbrain_gate    # see config/knowledge.yaml

  gpu_workload:
    stages: []
    requires_resource: msi          # routed to resource scheduler, not a model
    workers: []

# ------------------------------------------------------ tool-need routing
# Maps an information/interaction NEED to the narrowest tool. `fallback` is
# used when the preferred tool is not usable (see config/mcp.yaml status).
tool_routing:
  developer_docs:        {prefer: context7,   fallback: [web_fetch]}
  github_structured:     {prefer: github_mcp, fallback: [gh_cli_readonly]}
  public_web_scrape:     {prefer: firecrawl,  fallback: [web_fetch]}
  local_private_crawl:   {prefer: crawl4ai,   fallback: [web_fetch]}
  deterministic_browser: {prefer: playwright, fallback: []}
  open_ended_browser:    {prefer: browser_use, fallback: [playwright]}
  adaptive_scrape:       {prefer: scrapling,  fallback: [firecrawl, web_fetch]}
  file_to_markdown:      {prefer: markitdown, fallback: [claude_obsidian_capture]}
  code_navigation:       {prefer: serena,     fallback: [ripgrep]}
  repo_packing:          {prefer: repomix,    fallback: [ripgrep]}
  web_search:            {prefer: web_search, fallback: []}

# ------------------------------------------------- fastgate / SystemOne (R3.1)
# The `fastgate` stage asks the configured backend ONE typed question over options that
# deterministic policy already approved (eligible workers); it can only narrow the choice.
# Built-in backends (agentos/systemone.py): "null" (default; always escalates, so routing is
# unchanged) and "policy-order" (reference/test backend: picks the first eligible option).
# Adapter backends (e.g. "laya-mlx") are DEFINED in the protected config/systemone.yaml. Selecting
# one here does NOT activate it: the router (runtime guard) and `agentos validate` accept an adapter
# backend only if it is listed in the protected `activation.production_backends` (empty by default),
# and a fastgate model only if listed in `activation.fastgate_models` AND usable. An unlisted
# selection is rejected by validate and falls back to the null backend at runtime. Editing this
# file therefore cannot enable a backend. Research/benchmark runs pass an explicit backend by
# name (human-invoked CLI/tests), never through this key. If a listed backend is unavailable, slow
# or invalid, SystemOne escalates and routing continues unchanged.
systemone:
  backend: "null"

# ---------------------------------------------------------------- budgets
# Numeric loop bounds (closes the gap recorded in
# docs/loop-graph-engineering.md appendix). Exceeding them forces an exit
# state; there is no infinite retry.
budgets:
  default:
    max_attempts: 3
    max_iterations: 20
    no_progress_after: 3         # consecutive iterations with an unchanged progress signal
    wall_clock_minutes: 60
  coding:
    max_attempts: 3
    max_iterations: 30
    no_progress_after: 3
    wall_clock_minutes: 120
  background_coding_escalation:
    max_attempts: 2
    max_iterations: 40
    no_progress_after: 4
    wall_clock_minutes: 240
  knowledge_ingest:
    max_attempts: 2
    max_iterations: 5
    no_progress_after: 2
    wall_clock_minutes: 30

exit_states: [success, blocked, no_progress, unsafe, timeout, budget_exhausted, human_handoff]

# ------------------------------------------------------------------ roles
roles:
  reviewer:
    rule: "Prefer a different model or harness than the primary worker."
  coding_specialist:
    preferred_agents: [claude_code, codex]
    background_escalation_agent: deepseek_harness

escalation:
  - condition: deterministic_check_failed
    action: retry_or_repair
    bounded_by: budgets
  - condition: no_progress
    action: escalate_model_or_specialist
    note: "Coding escalation target may be background_coding_escalation (DeepSeek Harness on NVIDIA NIM) — not a new orchestrator."
  - condition: high_risk_change
    action: human_review
  - condition: all_providers_unavailable
    action: blocked
  - condition: research_uncertainty
    action: parallel_independent_workers
    max_workers: 4

risk:
  high_requires_human_approval: true
  high_risk_task_markers: [credential_change, permission_change, external_publish, destructive_delete, payment, production_deploy, policy_change]

modes:
  task:     {default_workers: 1, max_workers: 2}
  workflow: {default_workers: 1, note: "Stable repeatable processes; deterministic automation engine (e.g. n8n) only if a real gap appears."}
  research: {default_workers: 2, max_workers: 4}

# ------------------------------------------------- intent -> skill preload
# Deterministic pre-model rule (agentos/intent.py). Force-preload `skill` only
# when ALL hold, within ONE clause of the request:
#   1. a mutation verb is in imperative position (clause start, after a polite
#      prefix); 2. the same clause names a code/repo target; and no clause
#      opens with a read-only/question lead. Anything else is NOT forced and
#      falls back to normal Hermes behaviour. Corpus: evals/intent-corpus.yaml.
# Preload only: workers stay reachable solely via agent-os-orchestrate -> agentos dispatch.
intent_rules:
  version: 1
  skill: agent-os-orchestrate
  polite_prefixes: [please, "can you", "could you", "would you", "will you", "i need you to",
                    "i want you to", "i'd like you to", "let's", "lets", "go ahead and", "now", "also"]
  mutation_verbs: [fix, implement, modify, refactor, update, repair, change, add, edit, rewrite,
                   rename, patch, migrate, remove, build, create]
  read_only_leads: [explain, review, research, summarize, summarise, compare, describe, what, why,
                    how, which, who, where, when, whether, find, investigate, analyze, analyse,
                    show, list, tell, is, are, does, do, did, should, audit, read, look]
  code_targets: [repo, repository, codebase, code, bug, bugs, test, tests, file, files, module,
                 modules, function, functions, class, classes, method, endpoint, endpoints,
                 feature, implementation, script, api, component, handler, parser, build, lint,
                 regression, failure, failures]
