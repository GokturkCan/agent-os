version: 1

# Skill inventory (reconciled 2026-10-01). Skills load progressively per
# task; none are injected into standing context by agent-stack. `agent_os`
# marks which skill sources Agent OS tasks are expected to use.

sources:

  superpowers:
    status: configured
    location: "Claude plugin superpowers@claude-plugins-official 7.0.0 (upstream v7.0.1)"
    role: "Software-engineering process SOP (how to engineer correctly)."
    agent_os: core

  ponytail:
    status: configured
    location: "~/agent-stack/skills/{ponytail,ponytail-review} (vendored)"
    role: "Simplicity / anti-overengineering policy."
    agent_os: core_policy
    source: "github.com/dietrichgebert/ponytail v5.3.2, commit 16352ac229eb08a9598dcae48fe9f2b342567d86 (MIT; hashes in scripts/runtime/skills.lock.json)"
    note: >
      Installed 2026-10-24: the two reviewed skill folders only, loaded through the Agent OS skill path
      (Hermes external_dirs). NOT the plugin wrapper: no hooks, status line, task ledger, webhook or
      mode tracking. The other four upstream skills (audit, debt, gain, help) are not installed.

  claude_obsidian:
    status: configured
    location: "Claude plugin claude-obsidian@agricidaniel-claude-obsidian 2.2.0"
    role: "SecondBrain knowledge engine (capture, transaction, lint, ingest)."
    agent_os: core

  kepano_obsidian_skills:
    status: configured
    location: "Claude plugin obsidian@obsidian-skills 1.0.1"
    role: "Obsidian markdown/bases/canvas conventions."
    agent_os: on_demand

  skill_creator:
    status: configured
    location: "Claude plugin skill-creator"
    role: "SKILL.md packaging."
    agent_os: on_demand

  orchestra_research:
    status: configured
    location: "~/.orchestra/skills (91 skills in 22 groups); symlinked into ~/.claude/skills, ~/.codex/skills and ~/.config/opencode/skills (91 links each)"
    role: "ML/research procedural skills."
    agent_os: research_on_demand
    exposure: >
      Agent OS side (2026-10-24): ONE index skill, skills/orchestra-index (generated by
      scripts/gen_orchestra_index.py), instead of 91 standing descriptions; the worker reads the single SKILL.md
      it needs. The interactive host skill directories are deliberately UNCHANGED (still 91 links each); any
      change to them is a separate, optional proposal.
    note: "Unnamespaced; collision risk noted in audit/claude-current-state.md. Earlier docs said 92; the verified count is 91."

  superclaude:
    status: disabled
    location: "~/.claude/commands/sc (31 commands) (+ pipx superclaude 4.1.9; upstream v4.3.0)"
    reason: "Overlapping planning/process framework with Superpowers. Not used by Agent OS tasks; left installed (no destructive cleanup)."

  opencode_gsd:
    status: disabled
    location: "~/.config/opencode/get-shit-done + 91 skills"
    reason: "Overlapping planning framework. Not used by Agent OS tasks."

  hermes_bundled_skills:
    status: configured
    location: "~/.hermes/skills (12 categories incl. autonomous-ai-agents/{claude-code,codex,opencode})"
    role: "Hermes-native procedures incl. worker delegation guides."
    agent_os: hermes_internal

  scientific_agent_skills:
    status: candidate
    role: "Research procedural registry (post-V1)."
    note: "UNVERIFIED source (no upstream URL established); not installed."
  last30days:
    status: candidate
    role: "Fresh/community intelligence."
    note: "UNVERIFIED source (no upstream URL established); not installed."
  openspec:
    status: available
    location: "npm global @fission-ai/openspec 0.17.2 (upstream v1.15.0)"
    role: "Spec-driven change proposals (same class as Spec Kit)."
    agent_os: dormant
    note: "Installed, unwired, not initialised in any project. Never run `openspec init` inside ~/agent-stack."

  agent_stack_local:
    status: available
    location: "~/agent-stack/skills"
    role: "Agent-OS-specific skills (SKILL.md packaging)."
    agent_os: core
