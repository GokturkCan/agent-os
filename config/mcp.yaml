version: 1

# This file is a canonical intended MCP/tool policy skeleton.
# It is NOT a live installation manifest — it does not claim any tool is
# installed or working just by being listed here. `status.installed` and
# `status.validated` must only be set true when repo evidence (an audit/
# file, a passing check) confirms it. See audit/claude-current-state.md
# (2026-09-15) for the last full inventory pass.

principles:
  - "Whitelist only — no ambient/implicit tool grants."
  - "Least privilege per role/task, not blanket access."
  - "Lazy / progressive loading — load a tool when a task needs it, not into standing context."
  - "Minimum relevant tools per task."
  - "Never claim installed or validated without repo evidence."

status_definitions:
  desired: "Candidate for adoption. Not yet installed."
  installed: "Present/configured locally, per audit evidence. May not be working."
  validated: "Installed AND confirmed working, per audit evidence."

tools:

  github:
    purpose: "Issue/PR/repo operations."
    status:
      desired: true
      installed: true
      validated: false
    note: "Configured but returned HTTP 401 (stale/invalid auth) as of audit/claude-current-state.md (2026-09-15). Needs re-authentication before use."

  context7:
    purpose: "Live library/framework documentation lookup."
    status:
      desired: true
      installed: true
      validated: true
    note: "Connected as of audit/claude-current-state.md (2026-09-15)."

  serena:
    purpose: "Semantic code navigation and editing (symbol-level)."
    status:
      desired: true
      installed: true
      validated: true
    note: "Connected as of audit/claude-current-state.md (2026-09-15)."

  playwright:
    purpose: "Browser automation / UI verification."
    status:
      desired: true
      installed: true
      validated: true
    note: "Connected as of audit/claude-current-state.md (2026-09-15)."

  firecrawl:
    purpose: "Web crawling / page-to-markdown extraction."
    status:
      desired: true
      installed: false
      validated: false
    note: "Not installed. Candidate — Crawl4AI is an alternative under the same slot, not yet evaluated against Firecrawl."

  repomix:
    purpose: "Repository packing/summarization for LLM context."
    status:
      desired: true
      installed: false
      validated: false

  terminal:
    purpose: "Shell execution."
    status:
      desired: true
      installed: true
      validated: true
    note: "Provided natively by the coding harness (Claude Code Bash tool, etc.), not a separate MCP server. Listed here for policy completeness only."

  filesystem:
    purpose: "File read/write."
    status:
      desired: true
      installed: true
      validated: true
    note: "Provided natively by the coding harness's Read/Write/Edit tools, not a separate MCP server. Listed here for policy completeness only."

  ssh:
    purpose: "Remote host access (e.g. MSI compute node)."
    status:
      desired: true
      installed: false
      validated: false
    note: "Candidate for once the MSI compute node is connected (see README.md priorities)."
