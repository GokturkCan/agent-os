version: 2

# Canonical MCP / tool inventory + exposure policy. Reconciled with
# `claude mcp list` on 2026-10-01 (see CURRENT_STATE.md). Status uses the
# vocabulary defined in config/models.yaml. `health` is the last observed
# connection result, not a promise.
#
# Exposure: agent-stack workers get MCPs ONLY via a generated
# --strict-mcp-config file (agentos/workers.py) built from `exposure`
# below + the worker's capability profile. Ambient user-level/claude.ai
# connectors are therefore NOT visible to Agent OS worker runs.

principles:
  - "Whitelist only — no ambient/implicit tool grants."
  - "Least privilege per worker profile; lazy, task-specific exposure."
  - "Prefer CLI/library when an MCP adds no real value."
  - "Never expose broad write-capable tools to every worker by default."
  - "Never claim installed/validated without evidence."

tools:

  context7:
    status: configured
    health: ok
    kind: mcp
    source: "~/.claude.json user mcpServers (npx -y @upstash/context7-mcp@4.4.4; pinned 2026-10-24)"
    launch: {command: npx, args: [-y, "@upstash/context7-mcp@4.4.4"]}
    write_capable: false
    capability: mcp_context7
    purpose: "Developer/library documentation."

  serena:
    status: configured
    health: ok
    kind: mcp
    source: "~/.claude.json user mcpServers (uvx serena v2.1.0, context ide-assistant; pinned 2026-10-24)"
    launch: {command: uvx, args: [--from, "git+https://github.com/oraios/serena@v2.1.0", serena, start-mcp-server, --context, ide-assistant, --enable-web-dashboard, "false", --enable-gui-log-window, "false"]}
    write_capable: true     # has symbol-edit tools; only granted with fs_write_worktree via coder profile
    capability: mcp_serena
    purpose: "Symbol-level code navigation/editing. Per-project index lives in <worktree>/.serena."

  playwright:
    status: configured
    health: ok
    kind: mcp
    source: "Claude plugin playwright@claude-plugins-official (the interactive plugin entry still runs @latest: plugin-managed, not pinned)"
    launch: {command: npx, args: ["@playwright/mcp@0.0.83"]}   # Agent OS worker launch is pinned
    write_capable: false
    capability: mcp_playwright
    purpose: "Deterministic browser interaction/testing."

  sequential_thinking:
    status: configured
    health: ok
    kind: mcp
    source: "~/.claude.json user mcpServers"
    capability: null
    exposure_note: "Not exposed to Agent OS workers — overlaps model-native reasoning; no measured value."

  github_mcp:
    status: configured
    health: ok
    kind: mcp
    source: "~/.claude.json user-scope server `github` (HTTP api.githubcopilot.com; replaces the plugin entry of the same URL)"
    write_capable: false     # server-enforced: X-MCP-Readonly=true exposes 22 read tools only (verified 2026-10-24)
    capability: mcp_github_read
    restricted_toolsets: [repos, issues, pull_requests]   # sent as X-MCP-Toolsets
    purpose: "GitHub structured data."
    auth: "macOS Keychain item github-mcp-pat read at connect time by headersHelper ~/.claude/bin/github-mcp-headers; fine-grained read-only PAT, expires 2027-01-21 (renew the Keychain item; no config change). No credential value lives in any repo or config file."
    note: >
      Repaired 2026-10-24 (the earlier HTTP 401 came from a dead PAT exported in the shell environment).
      Interactive / Hermes-side use. There is deliberately no `launch` here: the worker launcher supports
      command/args servers only, so this is never exposed to Agent OS workers.

  notion:
    status: configured
    health: ok
    kind: mcp
    source: "Claude plugin notion"
    exposure_note: "Personal-data connector; not exposed to Agent OS workers."

  postman:
    status: configured
    health: needs_auth
    kind: mcp
    exposure_note: "Not exposed to Agent OS workers."

  claude_ai_connectors:
    status: configured
    health: ok
    kind: mcp
    members: [gmail, google_drive, google_calendar, slack, lovable, magnific, higgsfield, claude_docs, stitch]
    exposure_note: >
      Account-level connectors visible to interactive Claude Code sessions.
      Several are write-capable with external side effects (send mail, post
      to Slack, publish). NEVER exposed to Agent OS worker runs (strict MCP
      config). Human-interactive use only.

  firecrawl:
    status: candidate
    kind: mcp_or_api
    capability: null
    note: "Not installed; no API key (hermes status). Fallback web_fetch."
  crawl4ai:
    status: candidate
    kind: library
    note: "Not installed. Adopt only on a real local/private crawl need."
  repomix:
    status: configured
    health: ok
    kind: cli
    version: "1.18.1"
    binary: "~/agent-stack/bin/repomix"
    runtime: "state/runtime/repomix (npm ci --ignore-scripts from scripts/runtime/repomix/)"
    write_capable: false
    note: "Installed 2026-10-24, pinned, isolated, on demand through the wrapper; no MCP, no global install, no standing context."
  markitdown:
    status: configured
    health: ok
    kind: cli
    version: "0.1.9"
    binary: "~/agent-stack/bin/markitdown"
    runtime: "state/runtime/markitdown (Python 3.11.13 venv; hash-locked scripts/runtime/markitdown.lock; extras pdf,docx,pptx,xlsx)"
    write_capable: false
    note: "Installed 2026-10-24, on demand through the wrapper; local files only by convention, plugins off, no global install. claude-obsidian capture remains the SecondBrain ingestion path."
  codebase_memory_mcp:
    status: candidate
    kind: mcp
    note: "Benchmark candidate for a derived structural index; not installed."
  browser_use:
    status: deferred
    note: "Open-ended browsing only when Playwright is insufficient."
  scrapling:
    status: deferred
  rtk:
    status: candidate
    kind: cli
    note: "Not installed."
  ssh:
    status: candidate
    kind: native
    note: "Needed for MSI; no host alias configured."

  terminal:
    status: available
    kind: native
    note: "Provided by the harness (Claude Bash / Codex sandbox)."
  filesystem:
    status: available
    kind: native
  web_fetch:
    status: available
    kind: native
  web_search:
    status: available
    kind: native
  gh_cli_readonly:
    status: available
    kind: cli
    note: >
      gh present; authentication state not verified by agents. Human/interactive use only: automatically
      dispatched Agent OS workers are denied `gh` (workers.yaml always_disallowed) and do not receive the
      user's gh identity (launch env isolation).
  ripgrep:
    status: available
    kind: cli
  claude_obsidian_capture:
    status: available
    kind: cli
    note: "claude-obsidian 2.2.0 capture adapters (offline, filesystem)."

# Which MCPs a worker profile may receive in its strict MCP config.
exposure:
  readonly: [context7, serena]
  coder: [context7, serena]
  reviewer: [context7, serena]
  knowledge_compiler: []
  untrusted: []
  browser_task: [playwright]      # added per-task only when the capability plan selects it (dispatch extra_mcp)
