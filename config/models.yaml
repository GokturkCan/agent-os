version: 1

# Conceptual mapping to docs/current-architecture.md Cognition Plane (C0-C4)
# — routing tiers below are NOT identical to that pipeline, just related:
#   fast     ~ C1 FastGate (classification only, not generation)
#   core     ~ C2 default local reasoning
#   strong   ~ C3 Mac local resilience / supervisor synthesis
#   frontier ~ C4 frontier reasoning/escalation
# All `model: null` entries below remain genuinely undecided/unbenchmarked.

tiers:
  fast:
    purpose: Cheap utility and mechanical tasks.
    model: null

  core:
    purpose: Default general worker.
    model: null

  strong:
    purpose: Supervisor and difficult synthesis.
    model: null

  frontier:
    purpose: Critical coding, review, and difficult reasoning.
    model: null

local:
  mac_resident:
    model: null
    candidates:
      - bonsai-2-27b
      - laya-mlx
    status: planned
    note: "Benchmark candidates only, not validated. See docs/current-architecture.md §6."

  msi_coding:
    model: null
    candidates:
      - qwen3.6-35b-a3b
    runtime_candidate: freetoken
    fallback_runtime_candidate: llama.cpp
    status: planned
    note: "Benchmark candidate only, not validated. See docs/current-architecture.md §6."

specialists:
  background_coding_escalation:
    model: deepseek-ai/deepseek-v4.1-flash
    provider: nvidia_nim
    harness: deepseek_harness
    status: adopted
    profile: high_reasoning
    validated: audit/nvidia-nim-2026-09-24.md
    suitable_for:
      - hard_repo_debugging
      - concurrency_bugs
      - long_horizon_coding
      - refactoring
      - regression_repair
      - code_verification
      - background_engineering
    not_suitable_for:
      - latency_sensitive_interactive
      - primary_hermes_backend
    note: >
      Validated as a strong autonomous coding specialist and a
      stateful/retry-capable harness, not as a second global orchestrator.
      Background/escalation use only.

experimental:
  colibri:
    enabled: false
    host: msi

  nvidia_nim_kimi_k3:
    enabled: false
    reason: "0-byte responses on chat and streaming; see audit/nvidia-nim-2026-09-23.md"
