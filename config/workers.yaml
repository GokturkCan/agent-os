version: 1

# Execution workers (harnesses). Workers execute; Hermes decides.
# One primary worker owns a task checkout at a time (enforced by
# agentos/worktree.py lease files). Workers never share a mutable checkout.
#
# `launch` is a template rendered by agentos/workers.py. Capability
# enforcement is by construction of the launch command (allowed tools,
# sandbox mode, strict MCP set), not by prompt text. The capability profile
# a worker may run under is defined in config/capabilities.yaml.

workers:

  claude_code:
    status: available
    binary: claude
    version_seen: "2.1.308"
    provider: claude_subscription
    roles: [coding_primary, architecture, hard_debugging, review]
    default_profile: coder
    allowed_profiles: [readonly, coder, reviewer, knowledge_compiler]
    headless: true
    launch:
      argv: [claude, -p, "{prompt}", --output-format, json, --max-turns, "{max_turns}",
             --strict-mcp-config, --mcp-config, "{mcp_config_file}",
             --allowedTools, "{allowed_tools}", --disallowedTools, "{disallowed_tools}",
             --permission-mode, "{permission_mode}"]
      cwd: "{worktree}"
    tool_map:            # capability -> Claude Code tool patterns
      fs_read: [Read, Glob, Grep]
      fs_write_worktree: [Edit, Write]
      shell: ["Bash"]
      shell_readonly: ["Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(ls:*)"]
      web_fetch: [WebFetch]
      web_search: [WebSearch]
    # The legacy prefix patterns only match the exact leading words ("git push"). A live probe
    # (2026-10-14, throwaway local remote) showed `git -C . push`, `/path/git push`, `git -c k=v push`,
    # `sh -c 'git push'` and `git --no-pager push` bypassed them; the wildcard forms below stopped
    # all 12 push/remote-rewrite spellings tried. Over-blocking (e.g. a path containing "github"
    # next to "push") is intentional: fail closed. `*git*remote*` also covers `git config remote.*`.
    # 2026-10-24: GitHub CLI credential protection for AUTOMATICALLY DISPATCHED workers only. These deny
    # patterns are command-text matching (defense in depth), NOT a sandbox: a Bash-enabled worker is not a hard
    # secrets boundary. They are passed per launch (--disallowedTools); interactive Claude Code is unaffected.
    # Only forms verified against a real worker are listed (`Bash(*/gh:*)` did not match absolute paths).
    always_disallowed: ["Bash(git push:*)", "Bash(git remote:*)", "Bash(*git*push*)", "Bash(*git*remote*)",
                        "Bash(rm -rf:*)", "Bash(sudo:*)",
                        "Bash(gh:*)", "Bash(env gh:*)", "Bash(/opt/homebrew/bin/gh:*)",
                        "Bash(*gh auth*)", "Bash(*gh api*)",
                        "Bash(security:*)", "Bash(/usr/bin/security:*)", "Bash(env security:*)",
                        "Bash(*security find-*)", "Bash(*security dump-*)", "Bash(*security export*)",
                        "Bash(*security add-*)", "Bash(*security delete-*)", "Bash(*security list-*)"]

  codex:
    status: available
    binary: codex
    version_seen: "0.164.0"
    provider: codex_subscription
    roles: [coding_primary, implementation, tests, routine_debugging, review]
    default_profile: coder
    allowed_profiles: [readonly, coder, reviewer]
    headless: true
    launch:
      argv: [codex, exec, --json, --ephemeral, -C, "{worktree}", --sandbox, "{sandbox}", "{prompt}"]
    sandbox_map:         # capability profile -> codex sandbox mode
      readonly: read-only
      reviewer: read-only
      coder: workspace-write
    never_flags: [--dangerously-bypass-approvals-and-sandbox]

  opencode:
    status: disabled
    reason: >
      Fail closed: the launch below runs with ambient, unrestricted tools and no sandbox or
      strict MCP set, so Agent OS cannot enforce a capability profile for it. Registered for
      future use; re-enable only after agentos/workers.py gains an enforcing adapter
      (ENFORCED_WORKERS). The router and build_launch refuse it regardless of this flag.
    binary: opencode
    version_seen: "2.0.20"
    roles: [overflow, utility]
    default_profile: readonly
    allowed_profiles: [readonly, coder]
    headless: true
    launch:
      argv: [opencode, run, --format, json, "{prompt}"]
      cwd: "{worktree}"
    never_flags: [--auto]
    note: >
      Optional overflow worker. ~/.config/opencode carries a legacy
      get-shit-done (GSD) pack and 91 skills — an overlapping planning
      framework; do not invoke GSD commands from Agent OS tasks.

  deepseek_harness:
    status: measured
    binary: "~/dsh-venv/bin/dsh"
    provider: nvidia_nim
    model: deepseek-ai/deepseek-v4.1-flash
    evidence: audit/nvidia-nim-2026-09-24.md
    roles: [background_coding_escalation]
    default_profile: coder
    allowed_profiles: [coder]
    interactive: false
    note: "Background/escalation only. Launch wrapper: ~/run_deepseek_harness_nim.py (outside repo)."

  hermes_delegation:
    status: configured
    roles: [orchestrator_internal]
    note: "Hermes' own delegation toolset. Hermes is the orchestrator, not a worker; listed so it is never selected as one."
    selectable: false

  local_qwen:
    status: candidate
    host: msi
    provider: local_msi
    roles: [local_reasoning]
    note: "Placeholder. Not measured; MSI unreachable."

  local_bonsai:
    status: candidate
    host: mac
    provider: local_mac
    roles: [local_fallback, compression]
    note: "Placeholder. No runtime/weights installed."

  prime:
    status: deferred
    note: "~/Projects/prime-agent present; not integrated. Optional."

  muse:
    status: deferred
  antigravity:
    status: deferred

# Executables withheld from EVERY automatically dispatched worker (2026-10-24). Claude workers are also denied by pattern
# (always_disallowed); every worker launch isolates GitHub credentials (agentos/workers.py). Capability planning reads
# this so a tool that needs one of these is never planned for a worker. Interactive sessions are not affected.
withheld_executables: [gh]

isolation:
  mode: git_worktree
  worktree_root: "~/agent-stack/state/worktrees"   # overridable per task
  lease_file: ".agentos-lease.json"
  one_primary_worker_per_checkout: true
